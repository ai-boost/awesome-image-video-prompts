notes:
  en: Stacks subject details (eyes, hair in wind, embroidered outfit) with lighting cues like volumetric sun rays and glowing particles, then sets depth of field and background architecture. A separate negative prompt list guards against anatomy and hand errors.
  zh: 先堆叠主体细节（眼睛、随风长发、刺绣服装），再配合体积光和漂浮光点等光照关键词，并指定景深与背景建筑。另附独立的负面提示词，用来规避人体和手部错误。
prompt: |
  blurry, low quality, low resolution, bad anatomy, extra fingers, missing fingers, deformed hands, distorted face, crossed eyes, duplicate elements, watermark, text, logo, cropped, out of frame, oversaturated colors, noise, artifacts, poorly drawn features, unrealistic proportions, messy background, motion blur.
