notes:
  en: 'The prompt lists every panel the poster needs: a large portrait, four named expressions, action poses, object icons, a color palette and a profile block. The style line sets a cozy Japanese kawaii look, and the uploaded photo keeps the character consistent across all panels.'
  zh: 提示词逐项列出海报需要的版块：大头像、四种命名表情、动作姿势、小物件图标、色板和档案栏。风格一句话定下温暖的日系可爱调性，上传的照片则让各个版块里的角色保持一致。
prompt: |
  Create an adorable character design sheet based on the uploaded image.
  Style: Warm, soft, and semi-realistic cartoon illustration with a cozy Japanese/kawaii style.
  Design: Character profile poster including:
  Large main portrait
  Various facial expressions (happy, annoyed, sleepy, surprised)
  Action poses (running, playing) (based on personality)
  Small object icons
  Color palette section
  Profile section with name and personality.
