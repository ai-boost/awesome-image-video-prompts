id: gpt-image-three-character-lounge-storyboard-beat-sheet
title:
  en: Storyboard sheet with overhead map and shot beats
  zh: 故事板分镜表含俯视机位图与镜头节拍
model: GPT Image 2
mode: text-to-image
category: infographic
tags:
- storyboard
