notes:
  en: The prompt sets the top layer as a dated magazine poster, then describes tears, curls and fading that expose older posters underneath, so the composition comes from paper layering rather than a designed grid. Physical cues such as fiber edges, glue residue and thickness, plus a phone street photo look with natural light, keep it from reading as a rendered mockup.
  zh: 提示词先把一张千禧年杂志海报设为最上层，再描述撕裂、捲曲和褪色露出底下的旧海报，构图由纸层覆盖形成而非网格设计。纸张纤维断面、膠水殘留和厚度等實體細節，加上自然光的手機街拍質感，讓畫面不像渲染的樣機。
prompt: |
  經典動漫遊戲女性角色 × 城市自然剝蝕拼貼 × 千禧年廣告海報

  一面真實城市街頭的舊牆壁，
  表面覆蓋著多個年代的動漫、遊戲和商業廣告海報。

  最上層是一張具有千禧年日本動漫遊戲雜誌風格的
  成年女性角色宣傳海報。

  海報經過自然風化，
  出現真實的撕裂、捲曲、褪色和局部剝落。

  破損區域露出下方不同年代的舊海報，
  包括殘缺的角色肖像、日文字體、
  復古廣告圖案和大面積印刷色塊。

  所有紙張具有真實厚度，
  破損邊緣露出纖維斷面，
  局部可見膠水殘留和細小陰影。

  圖像之間的關係由真實紙層覆蓋決定，
  形成意外而有趣的抽象構圖。

  畫面具有自然形成的街頭視覺檔案感，
  避免刻意設計的規則拼貼。

  真實iPhone街頭攝影質感，
  自然光，細膩紙張紋理，低AI感。

  n=6，9:16竪版。

  左下簽名：深藍色實心圓點在前，
  白色手寫體 DeepBlue 在後。
