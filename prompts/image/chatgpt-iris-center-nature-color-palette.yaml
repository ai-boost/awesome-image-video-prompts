notes:
  en: Uploading a close up iris photo and asking for it to sit at the exact center anchors the composition on the real eye. Asking the model to map every iris tone to a named natural object turns the color analysis into a labeled radial layout.
  zh: 上传虹膜特写照片并要求精确放在中心，让整个画面以真实眼睛为锚点。要求把虹膜中的每一种色调对应到一个具体的自然物体，于是颜色分析变成带标签的环形排版。
prompt: |
  Analyze the eye color in the photo I uploaded in every possible detail and create an artistic visual for me. Place my iris photo exactly at the center of the composition. Around it, visualize every color found within my iris using real elements from nature.
