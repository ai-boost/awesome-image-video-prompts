id: nano-banana-damaged-photo-restoration-upscale
title:
  en: Damaged vintage family photo restored to sharp DSLR quality
  zh: 受损的老旧合影修复为清晰的单反画质
model: Nano Banana 2
mode: image-edit
category: edit
