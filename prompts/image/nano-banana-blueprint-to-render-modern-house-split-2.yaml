id: nano-banana-blueprint-to-render-modern-house-split-2
title:
  en: Blueprint and Matching Modern House Render Split
  zh: 上方蓝图与下方现代住宅渲染对照图
model: Nano Banana 2
mode: text-to-image
category: architecture
tags:
