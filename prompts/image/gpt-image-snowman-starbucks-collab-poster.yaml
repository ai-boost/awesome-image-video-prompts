prompt: |
  A bright, cheerful summer co-branded beverage poster in a clean Chinese commercial advertising style, showing a collaboration between 蜜雪冰城 and STARBUCKS. Vertical poster layout with a soft blue sky background, sunlit greenery, and an outdoor cafe atmosphere. At the top, place both brand logos side by side with a large bold Chinese headline in playful hand-drawn display lettering: 雪王遇见星朋友. Beneath it, add a green ribbon banner with Chinese subheadline text: 米雪冰城 × 星巴克 联名开启, and a smaller line reading "甜蜜加倍·快乐翻倍". Include 2 circular stamp-style graphics: one on the left reading "联名限定", and one on the upper right like a postmark with Chinese text around a small drink icon. In the center foreground on a wooden outdoor table, display 2 iced drinks: on the left, a tall clear cup of vivid green matcha slush topped with a tall swirl of vanilla soft serve and green matcha drizzle, with visible ice texture and a cute snowman mascot logo on the cup; on the right, a tall clear Starbucks-style iced latte with milk and green matcha swirls at the bottom, topped with whipped cream and dark cookie crumbs, with the green siren logo on the cup. In front of the drinks, place 1 cute white snowman mascot figurine with a tiny crown, round body, rosy cheeks, red cape, and a happy wink, sitting and holding a small takeaway coffee cup. Add 2 vertical product name tags beside the drinks: left tag "雪顶抹茶星冰乐", right tag "抹茶雪王奥利奥". On the right midground, place 1 small black chalkboard sign on a wooden easel reading "ICE CREAM & COFFEE" with chalk drawings of an ice cream cone and a takeaway cup. In the lower left, create a torn-paper price block showing a combo offer with large red numbers "¥19.9", green supporting text, and a small green badge reading "立省 ¥6". In the lower center-right, add a "联名周边" area displaying exactly 4 merchandise items: 1 cup sleeve, 1 character keychain or acrylic charm, 1 round badge, and 1 small sticker or token, all using the snowman mascot and coffee collaboration theme. Use warm sunlight, glossy drink photography, shallow depth of field, soft bokeh trees, high contrast product retouching, crisp packaging details, and an upbeat youthful retail-promo aesthetic. Include scattered doodle hearts and playful decorative accents around the typography. Keep all visible text in Chinese except the Starbucks wordmark and the chalkboard text.
