notes:
  en: 'A JSON template with a SUBJECT placeholder fixes the layout: hero dish in the center, ingredients in bowls around it, and thin leader lines to bold headers with short sub-text. The style notes lock the palette (black, orange, white) and the reflective surface, so the template works for any dish.'
