notes:
  en: 'The prompt is a fill in the blanks template in three blocks: brand identity, surface and lighting, and product definition. Each field comes with example values, so one template can be reused for beef, crab or shrimp by changing only the product block.'
  zh: 提示词是三段式填空模板：品牌基础设定、核心视觉元素、主产品定义，每个字段都附带示例值。只需替换产品部分，就能复用于牛排、帝王蟹或甜虾。
prompt: |
  一、品牌基础设定
  品牌名称：[请填写，例如：PRIME STEAK / OCEAN PRIME]
  品牌标语：[请填写，例如：Steakhouse Quality, Your Table / Restaurant Grade, Home Delivered]
  主色调：[请填写，例如：黑金 / 深红+金 / 深蓝+银]
  字体风格：
  标题：[请填写，例如：金色衬线体，大写，奢华感]
  正文：[请填写，例如：细衬线体/无衬线体]
  二、核心视觉元素
  台面材质：[请填写，例如：大理石/黑色石板]
  背景调性：[请填写，例如：深色渐变/暗调餐厅环境]
  光线风格：[请填写，例如：聚光/侧光/顶部照明]
  三、主产品定义（必填）
  产品名称/类型：[请填写，例如：和牛牛排 / 帝王蟹 / 北极甜虾]
  产品数量/摆放：[请填写，例如：1份单品 / 3块整齐摆放]
  呈现方式：[请填写，例如：切片展示 / 带骨展示 / 原壳展示]
  产品特色/质感提示：[请填写，例如：肉质纹理清晰、多汁感 / 光泽晶亮 / 肉眼可见油花]
