id: nano-banana-blueprint-to-render-modern-house-split
title:
  en: Dark Blueprint Above Matching Modern House Render
  zh: 上方深色蓝图与下方对应的现代住宅渲染
model: Nano Banana 2
mode: text-to-image
category: architecture
tags:
