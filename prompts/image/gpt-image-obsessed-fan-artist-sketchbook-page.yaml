notes:
  en: 'The prompt names a persona, an obsessed fan artist, and lists the mix of content: full body poses, tiny chibi doodles, exaggerated expressions and close ups of hands or eyes. Asking for a white background with no grid and no order gives a loose overlapping layout, and a color placeholder for the clothes makes it easy to reuse.'
  zh: 提示词先设定狂热粉丝画师这个人设，再列出内容组合：全身姿势、迷你Q版涂鸦、夸张表情、手和眼睛的特写。要求白底、无网格、无秩序，得到松散重叠的版面，衣服颜色留作占位符，方便换用。
prompt: |
  Draw me as if an obsessed fan artist filled an entire sketchbook page - messy, overlapping, full-body poses, tiny chibi doodles, exaggerated expressions, and random close-ups of their hands or eyes.
  White background. No grid, no order. Pure chaos energy. With (any color) aesthetic clothes
