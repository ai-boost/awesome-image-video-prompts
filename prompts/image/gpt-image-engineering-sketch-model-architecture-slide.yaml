notes:
  en: The prompt fixes a pure white background, fine engineering linework and a handwritten dark gray title. Low opacity pale blue, green and orange watercolor accents then color code each stage, and annotated steps with small icons keep the layout clear.
  zh: 提示词先锁定纯白背景、精细工程线条和深灰手写标题，再用高透明度的淡蓝、淡绿、淡橙水彩区分各阶段，配合标注式步骤与简洁图标，让版面清爽有条理。
prompt: |
  -  纯白色背景，大量留白
  - 工程图纸线条风格（细腻、精确）
  - 手写体标题（深灰色）
  - 工程标注方式展示步骤
  - 淡蓝色、淡绿色、淡橙色水彩点缀（高透明度）
  - 类似苹果/特斯拉产品设计手稿的现代感
  - 简洁图标配合步骤说明
  - 清爽、专业、科技感
