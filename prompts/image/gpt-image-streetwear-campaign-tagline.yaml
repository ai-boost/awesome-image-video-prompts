id: gpt-image-streetwear-campaign-tagline
title:
  en: Streetwear campaign shot with one exact tagline
  zh: 街头服饰广告大片，标语只出现一次
model: GPT Image 2.5
mode: text-to-image
category: brand
tags:
- ad
- fashion
- text-render
source:
  name: OpenAI image prompting guide
  url: https://developers.openai.com/api/docs/guides/image-prompting#render-exact-text
  credit: OpenAI
  captured: '2026-10-28'
notes:
  en: 'The tagline is quoted and the prompt asks for it exactly once, then bans extra text, watermarks and unrelated logos. This is the pattern for any ad with fixed copy. Preview: the Sunburst variant.'
  zh: 标语加引号，并要求只出现一次，再禁止多余文字、水印和无关标志。凡是有固定文案的广告都可以照这个写。预览图为 Sunburst 版本。
prompt: |
  Give me a cool in culture ad / fashion shot for a brand called Thread.
  It's a hip young street brand. The ad shows a group of friends hanging out together with the tagline "Yours to Create."
  Make it feel like a polished campaign image for a youth streetwear audience: stylish, contemporary, energetic, and tasteful.
  Use clean composition, strong color direction, natural poses, and premium fashion photography cues.
  Render the tagline exactly once, clearly and legibly, integrated into the ad layout.
  No extra text, no watermarks, no unrelated logos.
