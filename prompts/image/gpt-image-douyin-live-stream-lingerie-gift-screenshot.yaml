notes:
  en: The prompt names the exact on-screen values (viewer count 99996, an 18+ badge and a named gift sender), so the model places each one as a platform UI overlay rather than decorative text. Naming the platform and asking for a screenshot keeps the result in a phone capture style instead of a poster.
