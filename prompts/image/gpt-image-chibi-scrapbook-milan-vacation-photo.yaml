notes:
  en: Starts by removing bystanders, then asks for small chibi copies that match her hairstyle and outfit, each doing a different local activity. Doodles in white and pink ink, such as arrows, stars and hearts, plus handwritten captions tied to the city, give the scrapbook feel.
  zh: 先删除路人，再要求多个与本人发型和服装一致的Q版小人，各自做不同的当地活动。白色和粉色手绘涂鸦（箭头、星星、爱心）加上与城市相关的手写短句，营造手账感。
prompt: |
  remove the people around the main character, Add multiple small, cute chibi-style “mini versions” of her around the image. Each mini character should have a big head, expressive facial features, and match her hairstyle and outfit. Depict each mini version doing different vacation-related activities in italy. Enhance the image with playful, hand-drawn doodles and handwritten notes in white and pink ink, in a scrapbook style. Include elements like arrows, stars, hearts, sparkles, and sketchy lines. Add cute, handwritten vacation-themed phrases about Milan Italy.
