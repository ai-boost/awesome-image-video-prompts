notes:
  en: The billboard copy is quoted verbatim and paired with typography rules (bold sans-serif, high contrast, centred, appears once), which keeps the text legible. The product from the input photo is placed into a realistic highway scene at sunset.
  zh: 广告文案用引号逐字锁定，并配合排版约束（粗体无衬线、高对比、居中、只出现一次），使文字清晰可读。输入图中的产品被置入日落时分的真实公路场景。
prompt: |
  Create a realistic billboard mockup of the shampoo on a highway scene during sunset.
  Billboard text (EXACT, verbatim, no extra characters):
  "Fresh and clean"
  Typography: bold sans-serif, high contrast, centered, clean kerning.
  Ensure text appears once and is perfectly legible.
  No watermarks, no logos.
