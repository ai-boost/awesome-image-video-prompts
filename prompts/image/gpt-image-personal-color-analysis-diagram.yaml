notes:
  en: The prompt asks for a visual comparison first and caps the text, so the model shows each clothing color on the same face and adds only short labels. Supplying a portrait as the reference keeps the face consistent across every swatch panel.
  zh: 提示词要求先用视觉对比、再严格限制文字，模型因此把各种服装颜色直接套在同一张脸上，只配简短标签。以人像作参考图，能让每个色板中的面部保持一致。
prompt: |
  Using this portrait, create a diagram-first personal color analysis. Show which clothing colors suit the subject through visual comparison. Keep text minimal and avoid paragraphs.
