notes:
  en: 'The prompt names the few elements to convert, then lists everything that must stay identical: face, skin, noodles, broth, background, lighting, pose and framing. The style is pinned down with clean linework, flat cel shading and pastel colours, so the anime layer stays local.'
  zh: 提示词先点明只转换的少数元素,再逐项列出必须保持不变的内容:脸、皮肤、面条、汤、背景、光线、姿势和构图。风格用干净线稿、平涂赛璐珞和粉彩色限定,让动漫效果只作用于局部。
prompt: |
  Convert only her hair, the bowl, and the chopsticks into a 2D hand-drawn anime illustration with clean linework, flat cel shading, and vibrant pastel colours. Keep her face, skin, eyes, lips, noodles, broth, background, lighting, pose, and framing the same as in the original photo.
