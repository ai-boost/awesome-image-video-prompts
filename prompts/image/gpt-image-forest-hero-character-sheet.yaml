id: gpt-image-forest-hero-character-sheet
title:
  en: Watercolor forest hero for a children's book
  zh: 儿童绘本水彩森林小英雄
model: GPT Image 2.5
mode: text-to-image
category: character
tags:
- character
- childrens-book
- watercolor
source:
  name: OpenAI image prompting guide
  url: https://developers.openai.com/api/docs/guides/image-prompting#keep-a-character-consistent
  credit: OpenAI
  captured: '2026-10-28'
notes:
  en: Character, theme, style and constraints sit in separate labeled blocks, so the outfit, the animal companions and the picture book proportions all come through. The constraints block asks for an original character and no text, which keeps the result clean enough to reuse across pages.
  zh: 提示词把角色、主题、风格和约束分成带标签的段落，服装、小动物伙伴和绘本比例因此都能准确呈现。约束段要求原创角色且不含文字，画面干净，便于在后续页面中重复使用。
prompt: |
  Create a children’s book illustration introducing a main character.

  Character:
  A young, storybook-style hero inspired by a little forest outlaw,
  wearing a simple green hooded tunic, soft brown boots, and a small belt pouch.
  The character has a kind expression, gentle eyes, and a brave but warm demeanor.
  Carries a small wooden bow used only for helping, never harming.

  Theme:
  The character protects and rescues small forest animals like squirrels, birds, and rabbits.

  Style:
  Children’s book illustration, hand-painted watercolor look,
  soft outlines, warm earthy colors, whimsical and friendly.
  Proportions suitable for picture books (slightly oversized head, expressive face).

  Constraints:
  - Original character (no copyrighted characters)
  - No text
  - No watermarks
  - Plain forest background to clearly showcase the character
