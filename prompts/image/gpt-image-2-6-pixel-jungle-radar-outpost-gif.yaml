notes:
  en: A 4x4 spritesheet of 16 frames at about 200 ms each, with a fixed camera, turns the scene into a seamless loop. The prompt lists each moving element separately (radar beam, rope swing, birds, creatures) and fixes the buildings and trees in place so the world stays stable between frames.
