  en: Starts from a reference photo and describes each figure separately with hair, accessories, clothing and pose, so the likeness carries over into the toy look. Material cues (glossy vinyl, toy joints), a scene brief, a composition line and render keywords (Octane, Unreal Engine) keep the diorama consistent.
