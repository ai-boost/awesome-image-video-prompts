notes:
  en: Attaching one full body character render and naming the pixel size (128px), the grid (4x4) and the motion type keeps hair, jacket and boots consistent across all sixteen frames. Asking for a transparent background and a follow-up GIF makes the sheet ready for animation.
  zh: 附上一张全身角色渲染图，并写明像素尺寸（128px）、网格（4x4）和动作类型，让十六帧里的发型、外套和靴子保持一致。要求透明背景并接着生成 GIF，让精灵表可以直接用于动画。
prompt: |
  Make a simplified 128px pixel art combat motion sprite sheet of this character, transparent background if you can, arrange it 4x4.
