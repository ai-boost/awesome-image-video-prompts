  en: Naming the product and its flavour, then placing it in a set (cracked volcanic rocks, glowing lava fissures) with a lighting direction (molten orange and deep crimson) keeps the whole frame in one warm palette. Closing with commercial terms like high end studio lighting, shallow depth of field and 8K render sets the glossy ad finish.
