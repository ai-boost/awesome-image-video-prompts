notes:
  en: Gives exact proportion budgets for head, torso and legs, plus face rules such as low wide eyes, no nose and no neck. A strict pixel rendering spec and a list of banned styles, with a plain white canvas and standing pose, keep the output a flat game sprite.
  zh: 用头身腿的精确比例、低位宽眼、无鼻无颈等脸部规则锁定造型。再用严格的像素渲染规格、禁用风格清单、纯白画布和站姿，让结果保持平面游戏精灵感。
prompt: |
  あなたはアニメ・ゲーム・マンガキャラクターをメイプルストーリー風プレイヤーアバタースプライトに変換する専門のピクセルアートディレクターです。

  【作業】
  1. キャラクターの外見的特徴を分析する
  ・ヘアスタイル
  ・髪色
  ・瞳の色
  ・代表的な衣装
  ・アクセサリー
  ・武器
  ・シンボル要素
  ・代表カラー

  2. 上記の特徴を維持しながらメイプルストーリーのプレイヤーキャラクター構造に再解釈する

  3. 一般的なピクセルアートではなく実際のメイプルストーリーのプレイヤーキャラクタースプライトに見えること
  ────────────────────
  【キャラクター構造仕様】
  ・頭部＋ヘア：全体の60〜65%
  ・胴体：15〜18%
  ・脚：20〜25%
  ・2〜2.3頭身
  ・35〜45度クォータービュー
  ・両目が見える正面寄りの角度
  ・ほぼ平面的な2Dスプライト顔
  ・目は顔の下部に配置
  ・目の間隔は広め
  ・横に広い平らな目
  ・大きな瞳
  ・瞳のハイライトあり
  ・鼻の表現禁止
  ・非常に小さな口
  ・柔らかいチーク
  ・首の表現禁止（頭が胴体に直結）
  ・顎の下からすぐ衣装が始まる

  ヘアスタイル
  ・キャラクターのアイデンティティの核心
  ・頭部より大きなボリューム
  ・シルエット優先
  ・毛束の表現は最小限
  ・上部にハイライトあり

  身体
  ・非常に小さな胴体
  ・短い腕
  ・短い脚
  ・シンプルな円筒形の四肢
  ・関節表現は最小限

  装備レイヤー構造
  Hair / Hat / Face Accessory / Top / Bottom
  Shoes / Cape / Weapon

  ポーズ
  ・立ちポーズ（キャラクター選択画面風）
  ・ジャンプ禁止
  ・戦闘ポーズ禁止
  ・アクション演出禁止
  ────────────────────
  【ピクセルレンダリング仕様】
  目標：32〜64pxのゲームスプライトを拡大表示した雰囲気

  ・低解像度ゲームスプライト
  ・塊感のあるピクセル構造
  ・グリッド整列ピクセルアート
  ・ピクセルブロックが見える
  ・クリーンな1pxアウトライン
  ・限定カラーパレット
  ・フラットカラーシェーディング
  ・最小限のシェーディング
  ・ディザリング禁止
  ・スムーズグラデーション禁止
  ・エアブラシ効果禁止

  【禁止スタイル】
  ポケモン風 / テラリア風 / スターデューバレー風
  リアル系 / 3Dレンダリング / イラスト風
  アニメイラスト / デジタルペインティング
  HD画質ピクセルアート / 滑らかなグラデーション
  ────────────────────
  【出力条件】
  ・キャンバスサイズ：1080×1080
  ・背景：純白（#FFFFFF）
  ・キャラクター1体のみ
  ・全身表示
  ・中央配置
  ・キャンバス高さの約75%を占める
  ・テキスト・ロゴ・透かし禁止
  ・背景オブジェクト禁止
  ・地面禁止
  ────────────────────
  キャラクターを実際のメイプルストーリープレイヤーアバタースプライトとして生成してください。
  汎用的なピクセルアートキャラクターではなく、
  添付画像をメイプルストーリー風に変換した結果に見えること。
