notes:
  en: The prompt hands the content to ChatGPT memory, so the model fills in a personal bio, values and hobbies without any details typed in. Naming two formats, infographic and cartoon anime, gets a layout of labeled panels around a character portrait.
  zh: 提示词把内容交给 ChatGPT 的记忆，不用手写任何个人细节，模型自己补全简介、价值观和爱好。同时指定信息图和卡通动漫两种形式，得到围绕角色肖像的分区标注版面。
prompt: |
  Ask ChatGPT knowing everything it knows about you to generate an image of yourself with GPT Image 2

  prompt: Knowing everything you know about me,  make an infographic of me. Make a cartoon anime style image.

  I'd love to see what you got.
