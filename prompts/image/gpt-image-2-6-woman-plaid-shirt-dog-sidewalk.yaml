notes:
  en: Two reference images are passed with a placement instruction, so the second image supplies only the dog. The phrase right next to the woman anchors where the new subject goes, and the closing do not change anything else keeps the person, lighting and street background intact.
  zh: 同时提供两张参考图，由第二张图只提供狗。放在女子旁边的指令明确了新主体的位置，结尾的不要改变其他内容则让人物、光线和街景背景保持不变。
prompt: |
  Place the dog from the second image into the setting of image 1, right next to the woman, use the same style of lighting, composition and background. Do not change anything else.
