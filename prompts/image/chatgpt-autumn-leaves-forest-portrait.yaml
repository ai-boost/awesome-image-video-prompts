  en: Anchoring identity to the reference photo with explicit face, hair and body instructions, then specifying an upward camera angle, golden evening backlight and layered maple leaves in the foreground and background gives the scene depth while keeping the subject recognizable. The editorial photography cue sets a clean, professional finish.
