notes:
  en: A role brief with a brand template to fill in sets one fixed structure for every concept, so each is described on the same fields and shown on business card, app icon and billboard mockups. The forced final pick turns the sheet into a side-by-side decision tool.
  zh: 角色设定加品牌模板的固定结构，要求每个概念都按同一字段描述，并放到名片、App 图标和广告牌样机上。结尾强制选出一个方案，使整张图成为可直接比较的决策表。
prompt: |
  你是一位拥有20年经验的顶级Logo设计师，为全球知名品牌设计过即时识别且深具意义的标志。

  品牌名称：[你的品牌名]
  行业：[你的行业]
  品牌个性：[描述]
  目标受众：[描述]
  欣赏的视觉身份：[列举3个]
  讨厌的视觉身份：[列举3个]
  偏好风格：[如极简、大胆、几何、有机、复古、未来]

  为我的品牌生成5个完全不同的Logo概念。

  对每个概念提供：

  - 核心视觉理念及象征意义
  - 形状语言及为何适合品牌
  - 字体方向建议
  - 第一眼的情感触发
  - 为何适合目标受众
  - 在名片、App图标和广告牌上的效果
  - 何为永恒而非潮流

  然后告诉我，如果这是你的品牌，你会选哪个以及原因。

  2. 品牌身份基础提示词

  你是为财富500强公司和初创企业建立品牌身份的顶级品牌战略师，这些企业后来融资数百万。

  业务名称：[你的业务名]
  业务描述：[一句话]
  目标受众：[详细描述]
  竞争对手：[列举3-5个]
  想触发的感受：[如信任、兴奋、奢华、亲近、力量]
  想关联的词汇：[列举5-10个]
  不想关联的词汇：[列举5-10个]

  在设计任何视觉效果之前建立完整的品牌身份基础。

  为我提供：

  - 品牌原型及为何完美契合
  - 5个具体人类特征描述的品牌个性
  - 带示例的品牌语调指南
  - 核心品牌承诺（一句话）
  - 3个品牌应触发的情感层级
  - 与竞争对手的根本差异
  - 定义品牌的唯一关键词

  3. 配色方案提示词

  你是色彩心理学专家和品牌设计师，深知色彩如何触发情感、建立信任和驱动购买决策。

  品牌名称：[你的品牌名]
  行业：[你的行业]
  目标受众：[年龄、性别、收入、生活方式]
  想触发的首要情感：[如信任、能量、奢华、平静、兴奋]
  前3名竞争对手颜色：[列举]
  喜欢的颜色：[列举]
  讨厌的颜色：[列举]

  为我建立完整品牌配色板。

  为我提供：

  - 主色及其HEX代码和心理学解释
  - 两个辅助色及HEX代码
  - 一个强调色用于CTA和高亮
  - 一个中性色用于背景和文字
  - 每种颜色对目标受众的影响
  - 与竞争对手的差异化
  - 在网站、社交媒体和包装上的应用示例
  - 永远不要搭配的颜色组合及原因

  4. 字体方向提示词

  你是字体专家和品牌设计师，深知字体如何传达个性、建立可信度和实现品牌即时识别。

  品牌名称：[你的品牌名]
  品牌个性：[5个词]
  行业：[你的行业]
  目标受众：[描述]
  字体应触发的感受：[如权威、友好、创新、优雅、能量]
  喜欢的品牌字体：[列举3个]

  为我建立完整字体系统。

  为我提供：

  - 标题用主显示字体名称及为何完美
  - 长文本的辅助字体
  - 引言或重点的强调字体
  - 标题、副标题、正文、说明文字的精确字号层级
  - 字距和行高建议
  - 字体搭配方法
  - 预算有限时的免费替代方案
  - 你所在行业应避免的字体错误

  5. 完整品牌身份包提示词

  你是顶级品牌代理创意总监，交付覆盖每个触点的完整品牌身份系统。

  业务名称：[你的业务名]
  业务描述：[一句话]
  目标受众：[详细描述]
  品牌个性：[5个词]
  行业：[你的行业]
  竞争对手：[列举3个]
  设计工具预算：[免费或付费]
  时间表：[你需要的时间]

  在一个回复中交付我的完整品牌身份系统。

  包含所有元素：

  - 品牌战略基础、原型、个性、承诺和定位
  - Logo概念及3个变体
  - 完整配色板、HEX代码和使用规则
  - 字体系统、名称、字号和层级
  - 视觉方向指南
  - 品牌语调指南和标语选项
  - 社交媒体视觉模板
  - 3条永远不要打破的核心品牌规则

  将一切作为结构化品牌手册交付，任何设计师、开发者或AI工具都能在10分钟内完全理解你的品牌。
