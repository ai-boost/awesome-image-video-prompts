id: gpt-image-logo-concepts-ai-newsletter-sheet
title:
  en: Five logo concepts with mockups for an AI newsletter
  zh: AI 新闻通讯的五个标志概念及样机展示
model: GPT Image 2
mode: text-to-image
category: brand
tags:
