notes:
  en: A structured JSON spec splits face, hair, clothing, lighting and camera into separate fields, so each detail is controlled on its own. Naming a 24 to 28mm phone lens, clipped HDR highlights and a long avoid list keeps the result casual instead of studio polished.
  zh: 用结构化JSON把面部、头发、服装、光线和相机拆成独立字段，每个细节都能单独控制。写明24到28毫米手机镜头、过曝高光，再配上很长的避免清单，画面保持随手拍的真实感，不会变成影棚质感。
