  en: The prompt draws on ChatGPT's saved memory of the user, so no personal details need to be typed in. Asking for the design, a meaning for each element and a closing rationale in one message produces a mockup with a matching legend panel.
  zh: 这个提示词依赖 ChatGPT 保存的用户记忆，无需手动输入个人信息。一次性要求设计图、每个元素的寓意以及最终理由，就能得到带配套图例面板的纹身效果图。
prompt: |
