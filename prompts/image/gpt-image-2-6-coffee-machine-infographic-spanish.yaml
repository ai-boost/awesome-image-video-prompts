id: gpt-image-2-6-coffee-machine-infographic-spanish
title:
  en: Coffee machine infographic translated into Spanish
  zh: 咖啡机信息图翻译成西班牙语
model: GPT Image 2.6
mode: image-edit
category: infographic
tags:
- translation
- infographic
- layout-preservation
- localization
source:
  name: OpenAI image prompting guide
  url: https://developers.openai.com/api/docs/guides/image-prompting#translate-while-preserving-layout
