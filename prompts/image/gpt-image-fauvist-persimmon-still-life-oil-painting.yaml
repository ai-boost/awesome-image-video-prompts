prompt: |
  A bold post-impressionist still life painting in thick impasto oil brushstrokes, viewed from slightly above. Center a round turquoise plate holding exactly 3 bright orange persimmons with green leafy tops, arranged in a triangular cluster. Place the plate on a vivid red tablecloth. In the upper left, add a dark green glass bottle casting a soft shadow onto a textured mustard-yellow wall. In the lower left, include a folded cloth napkin with wide cream and muted blue vertical stripes. On the right side of the table, place a kitchen knife with a shiny silver blade and a deep blue handle angled diagonally upward. Use saturated complementary colors, expressive painterly texture, visible palette-knife-like strokes, simplified forms, dark contour accents, and a warm, lively Fauvist color sensibility. The composition should feel handmade, energetic, and slightly naive, like a modern museum-style still life oil painting.
