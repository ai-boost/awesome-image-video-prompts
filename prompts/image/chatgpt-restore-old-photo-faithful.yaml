id: chatgpt-restore-old-photo-faithful
title:
  en: Faithful restoration of an old photograph
  zh: 忠实修复旧照片
model: ChatGPT
mode: image-edit
category: edit
tags:
- photo-restoration
- image-restoration
- old-photos
