  zh: 采用结构化 JSON 提示词，其中 wardrobe_update 模块替换参考照片的服装，keep 列表固定配饰和发型。通过位置描述道具（左侧圣诞树，后方楼梯）并附加负面提示列表，使编辑后的场景保持稳定。
