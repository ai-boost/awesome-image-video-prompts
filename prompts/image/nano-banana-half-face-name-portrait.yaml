notes:
  en: The prompt keeps half the face visible and stacks the name vertically on the other side, with each letter cut out to show the matching part of the hidden half, so the face still reads as one. Fill in the name, backdrop and lighting.
  zh: 提示词保留半张脸，在另一侧竖排名字，每个字母镂空透出被遮住那半张脸的对应部分，整张脸依然连贯。填入名字、背景和光线即可。
prompt: |
  Transform the uploaded image into a modern studio portrait. Preserve the subject’s identity and features. Show half the face on the left; stack [NAME] vertically on the right, with each letter filled by matching details from the hidden half. Seamless alignment, [BACKGROUND] backdrop, [LIGHTING], modern typography.
