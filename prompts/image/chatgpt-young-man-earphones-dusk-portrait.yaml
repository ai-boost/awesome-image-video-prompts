  en: The prompt places the subject in the lower right and the sun at left, leaving the upper sky empty as negative space, with foliage entering from the top edge as a foreground frame. An 85mm telephoto at f/2.8, a backlit silhouette body and a muted palette make the shot read as candid and cinematic rather than posed.
