id: chatgpt-doorway-to-my-future
title:
  en: Split doorway showing past life and future
  zh: 分裂的门道，一边是过去，一边是未来
model: ChatGPT
mode: text-to-image
category: illustration
tags:
- split-screen
- personal
- metaphor
source:
  name: '@_allluvdashay._ on TikTok'
  url: https://www.tiktok.com/@_allluvdashay._/video/7683225631181606158
  credit: _AllLuvDashay._
  likes: 90
  captured: '2026-10-30'
  posted: '2026-09-08'
notes:
  en: The prompt hands every creative decision to the model and bans follow up questions, so one message produces a finished image. Setting a left side for what is left behind and a right side for what comes next gives the output a clear before and after structure.
  zh: 这个提示把所有创作决定交给模型，并禁止追问，因此一条消息就能得到完整图像。用左侧表示离开的过去、右侧表示即将踏入的未来，画面形成清晰的前后对比结构。
prompt: |
  Using what you know about me, show me the doorway to my future. Show what I’m leaving behind on one side and what I’m stepping into on the other. Make it personal to me and choose everything yourself. Don’t ask me questions—just create it.
