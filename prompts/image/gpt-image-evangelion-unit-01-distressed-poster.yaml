prompt: |
  A gritty vertical anime-mecha poster in distressed screen-print style, inspired by retro military dossiers and Evangelion key art. The main subject is a massive close-up side profile of EVANGELION: UNIT-01, dominating the right two-thirds of the composition, facing left with its jaws open in a feral scream. The head is angular and biomechanical, with deep purple armor, olive-green accent plates, black metal inner structures, a single long horn projecting diagonally upward to the left, sharp teeth, and a narrow glowing eye. The surface is scratched, chipped, weathered, and inked with heavy comic-style linework. Behind it is a dark navy blueprint background filled with 8 visible technical diagram clusters, white schematic lines, anatomical overlays, cross-sections, labels, measurement marks, and interface graphics. A violent red paint slash explodes diagonally across the upper center and left side, with additional red drips running downward from the mecha’s mouth area. In the lower left corner, 1 small human figure sits hunched on a gray equipment crate: a teenage boy in a short-sleeve white school shirt, dark pants, and white sneakers, elbows on knees, looking down at a glowing handheld device, conveying isolation and anxiety. Add layered poster typography and warning graphics throughout the border: a torn yellow caution sign in the upper right with Japanese warning text and “CAUTION NERV ONLY”; a tall left sidebar with “01”, barcode-like blocks, hazard icons, and red-black labels; large distressed white kanji vertically stacked over the mecha torso; the word ESCAPE in spaced red capitals beneath the kanji; a small black label reading “PILOT: IKARI, SHINJI”; a bottom-right NERV logo; and footer text such as classified file markings and top secret stamps. Include 6 clearly readable English technical labels in the blueprint area: “TEST TYPE”, “BIOLOGICAL CONSTRAINT”, “AT FIELD”, “MAGI SYSTEM”, “INTERNAL”, and “CLASSIFIED MATERIAL”. Add Japanese dossier text blocks as authentic graphic texture. The palette is limited to dark indigo, black, crimson red, purple, olive green, dirty beige, and off-white. High contrast, torn-paper collage details, halftone texture, ink splatter, cracked paint, and worn print edges. Cinematic, oppressive, chaotic, collectible poster design, ultra-detailed, sharp, textured, no clean modern polish.
