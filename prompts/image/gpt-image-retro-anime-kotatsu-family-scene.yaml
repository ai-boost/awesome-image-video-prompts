prompt: |
  A nostalgic anime illustration set in a traditional Japanese tatami room during winter, viewed from a slightly elevated three-quarter angle. In the center is a low wooden kotatsu table covered with a thick brown patchwork quilt, with 2 floor cushions visible on the tatami. Around the table sit 3 people: a young woman with long straight teal blue hair and a pink sleeveless dress with a white collar, sitting at the far side of the table and peeling a mandarin orange; a second young woman with short bobbed purple hair, wearing a pale yellow top, blue skirt, and a white apron tied in a bow at the back, seated in the right foreground; and a small boy in a white shirt with blue sleeves and blue shorts, kneeling on the left and crawling partway under the kotatsu to warm himself. On top of the table are 3 green-yellow plastic bottles labeled "mello Yello", a round woven tray holding 5 whole mandarins, and 1 peeled mandarin with loose orange peels spread on the tabletop. In the left background stands a chunky 1980s CRT television with woodgrain side panels on a low TV stand, with a silver video deck or console beneath it. The TV screen shows a blue title card with white Japanese credits and a glowing pale circular shape. Behind the characters are 1 shoji sliding door on the left and 2 beige fusuma sliding doors on the right wall. Warm indoor lighting, cozy family atmosphere, retro Showa-era Japanese home, detailed hand-drawn cel-anime style with soft shading, clean linework, and slightly faded vintage colors.
