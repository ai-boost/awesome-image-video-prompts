notes:
  en: The prompt names one clear device, polo color swatches worn by the same subject, and asks for a visual first layout with explanations and tips. That makes the model build best, good and avoid rows, a palette and a short rationale from a single uploaded photo.
  zh: 提示词只指定一个明确手法，即同一人物换穿不同颜色的马球衫做对比，并要求视觉优先、附说明和建议。模型因此能从一张上传照片生成最佳、可选、避免三组对比、色板和简短理由。
prompt: |
  Create a personal color analysis using this picture. Use polo clothing color comparisons to highlight which colors suit the subject best. Make it visual-first, with explanations and tips.
