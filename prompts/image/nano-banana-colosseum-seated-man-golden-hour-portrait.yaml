notes:
  en: The prompt fixes the pose with specific limb placement (left hand on thigh, right hand gripping the left cuff) and sets one directional light at 45 degrees from the front left, naming the shadows it casts so the lighting stays consistent. The 85mm lens and wide aperture keep the subject sharp while the landmark stays recognizable but soft behind him.
