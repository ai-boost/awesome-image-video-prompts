notes:
  en: Naming a close shot, heavy film grain and haze, and a fixed palette of reds, pinks and earth tones makes the image read as one cinematic still. Spelling out the logo and slogan text exactly keeps the serif headline and sans line clearly legible over the busy background.
  zh: 明确写出近景构图、胶片颗粒与雾感，并给出红、粉、土色的固定色板，画面就会像一张完整的电影剧照。把徽标和标语文字写清楚，衬线主标题和无衬线副标题在复杂背景上也能保持清晰可读。
