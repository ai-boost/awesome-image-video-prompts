notes:
  en: The prompt splits the lighting into warm orange red backlight, cool cyan fill and on-camera flash, so the subject stays sharp while traffic turns into long exposure streaks. A film grain 35mm look, a framing instruction (hips up, centered, 4:5) and an avoid list keep the skin realistic.
