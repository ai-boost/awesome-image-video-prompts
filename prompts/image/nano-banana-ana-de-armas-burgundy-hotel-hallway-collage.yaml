notes:
  en: A structured JSON prompt fixes the scene, wardrobe and camera once, then assigns each grid cell its own pose and panel position so the four frames stay consistent. The 85mm f/2.0 portrait lens and warm wall-lamp lighting give it a magazine editorial feel.
  zh: 用结构化 JSON 一次性固定场景、服装与镜头参数，再为四宫格每一格单独指定姿势和位置，使四个画面的人物与氛围保持一致。85mm、f/2.0 的人像镜头与暖色壁灯打光营造杂志大片质感。
