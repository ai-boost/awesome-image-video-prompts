notes:
  en: A JSON prompt locks identity to an uploaded reference, then gives each of the three frames its own shot type, lighting and mood. A shared color grade of muted brown with film grain, plus a negative constraints list, keeps the collage cohesive.
  zh: 用 JSON 结构锁定参考图人物身份，并为三个画格分别指定景别、光线和情绪。统一的棕色调胶片颗粒调色加上负面约束清单，让拼贴保持一致。
