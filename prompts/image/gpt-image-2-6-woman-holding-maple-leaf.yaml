notes:
  en: Attaches a reference image and fixes the framing (chest up, fixed camera, single shot) and the exact GIF spec (288x512, 16 frames, 200 ms per frame, looping). It asks for hair and leaves to shift frame by frame instead of duplicating frames, which keeps the loop natural.
  zh: 上传参考图并固定构图（胸部以上、固定镜头、单镜头）以及GIF规格（288×512、16帧、每帧200毫秒、循环），要求发丝和叶片逐帧微变而非复制帧，使循环更自然。
prompt: |
  添付画像を基準に、アニメーションGIFファイルを生成してください。

  【出力仕様】
  ・各フレームの幅：288px
  ・各フレームの高さ：512px
  ・総フレーム数：16フレーム
  ・各フレームの表示時間：200ミリ秒
  ・合計再生時間：3.2秒
  ・無限ループ
  ・この寸法をGIFファイルそのもののピクセル寸法として使用する。表示上のサイズだけを変えたり、余白を追加して寸法を合わせたりしない。

  【映像内容】
  参考画像と同じミライ、同じ顔、短いボブ、衣装、秋の街並み、日差しを維持する。

  構図は胸から上。顔全体と頭の上が入り、右手に持った赤いモミジが胸元に見える。
  カメラ固定、ワンカット。

  ミライがカメラを見ながら口元を少しほころばせ、一度だけ自然に瞬きをする。
  風でボブの毛先と背景の紅葉が少し揺れる。
  最後は最初の表情と姿勢へ戻り、自然につながるループにする。

  全フレームを同じ人物の連続動作として描く。
  フレームを単純に複製して枚数だけを増やさず、毛先や背景の葉の動きを時間に沿って少しずつ変える。
  顔立ちや衣装を途中で変更しない。

  静止画、分割画像、絵コンテではなく、動くGIFを出力する。
  字幕、文字、ロゴ、透かし、音楽なし。
