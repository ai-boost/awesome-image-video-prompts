notes:
  en: Two reference images with identity-lock lines pin the executor and target, and a timestamped beat sheet with shot types (push-in, hard cut, aerial ultra-wide) sets the escalation order. Explicit visual rules keep the two characters out of the same shot, and an ambience-only audio line stops the model from adding music.
