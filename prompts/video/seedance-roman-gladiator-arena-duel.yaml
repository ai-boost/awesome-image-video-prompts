notes:
  en: Six shots with hard cuts at fixed five second marks, each assigned its own playback speed (real time, 2x, 40% slow motion). Continuity locks track the @image1 face, the shield state and which fighter holds which weapon at each timestamp, and a separate audio line lays out the crowd, horn, taiko and choir build.
