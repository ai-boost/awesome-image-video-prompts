notes:
  en: The prompt breaks the action into ordered beats with concrete props, such as the red artifact and the blue arc reactor lights, so the mech approach, pickup and portal opening stay in sequence. Describing the cast by costume and breed keeps the boy and the golden retriever consistent across the shot.
