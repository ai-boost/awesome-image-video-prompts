  en: A fixed 3 second timeline splits the 15 second fight into five beats, each with one clear action, and the on screen smoke text is written out as exact strings. A constraint line bans idle poses, hard cuts and teleportation, while a single physical rule (the mirror acts as liquid glass) ties ripples, cracks and reflections together.
