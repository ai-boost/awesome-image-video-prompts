notes:
  en: A timestamped beat sheet with quoted dialogue splits the clip into shots, and an image reference locks the face and outfit. Spelled out camera flaws (shake, focus hunting, no stabilization) and an ambience only sound list keep the look authentically amateur instead of polished travel content.
