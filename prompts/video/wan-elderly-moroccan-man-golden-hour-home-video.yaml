  en: A timed beat sheet of short actions keeps the clip on one subject, while the camera brief spells out the imperfections (no stabilization, autofocus hunting the backlight, warm digital noise) so the result reads as a home recording rather than a film. The subject description is repeated in full, which helps the face and clothing stay consistent across shots.
