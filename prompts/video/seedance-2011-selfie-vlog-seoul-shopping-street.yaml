notes:
  en: Separate blocks for camera, video quality, character, location, style and audio, then a timed shot list with one line of dialogue per beat. Naming dated hardware, 480p compression flaws and hand tremor keeps the footage amateur, and a closing rules block locks identity, 9:16 framing and no filters.
