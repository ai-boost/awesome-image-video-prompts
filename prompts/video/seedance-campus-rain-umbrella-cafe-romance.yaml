  en: The prompt lays out the story as ordered beats (rain, shared umbrella, café, sunlight after the storm) so a 30 second clip keeps a clear arc. Physical details such as umbrella physics, wet hair and puddle reflections, a handheld smartphone camera and a closing list of exclusions keep the look realistic.
