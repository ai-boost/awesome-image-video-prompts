notes:
  en: The prompt names the format (a montage of different clips) and the layout language (graphic motion layouts), then gives only the subject and setting. That leaves shot choice, film grain and panel arrangement to the model, so a short prompt gives a varied multi panel result.
  zh: 提示词只点明形式（不同片段的蒙太奇）和版式语言（动态图形排版），再给出主体与场景。镜头选择、胶片颗粒和分格排布都交给模型，所以短提示词也能得到多画面的丰富结果。
prompt: |
  Nostalgic montage of different clips. Graphic motion layouts of friends having fun in a theme park.
