notes:
  en: Every cut has a timed length and a dialogue line, and the camera is specified in detail (DV 16mm, propped or handheld POV, deliberate flaws like delayed focus and clumsy zooms), so the output reads as real camcorder footage. Ambient-only cuts give the montage room to breathe.
