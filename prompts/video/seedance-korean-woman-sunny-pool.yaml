notes:
  en: A five-slot timeline with a beat for each action and a line of dialogue gives the model a clear shot-by-shot structure. The 2000s camcorder spec (handheld, blown highlights, soft grain, no stabilization) sets the look, and each Korean line is paired with its meaning so the lip movement and action line up.
