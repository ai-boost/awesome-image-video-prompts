notes:
  en: Naming a sound that lasts the whole motion, the crackling paper, works as a speed instruction, so the peel unrolls as one continuous curl. A locked, straight-on camera keeps the wall still so only the paper moves.
  zh: 把贯穿全程的爆裂声写进提示词，相当于规定了揭开的速度，纸条因此一气呵成地卷落。固定的正对机位让墙面保持不动，只有墙纸在动。
prompt: |
  the strip peels downward in one continuous curl, the paper crackling and flaking at the edge
