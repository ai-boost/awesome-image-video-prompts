notes:
  en: Camcorder artifacts such as autofocus hunting, wind noise, static and blown highlights are named explicitly, and each five second beat pairs one action with one line of dialogue to pace the scare. The no polish and one visible person constraints keep the footage believable and stop the model from adding extra figures.
