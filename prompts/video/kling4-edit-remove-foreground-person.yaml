model: Kling 4.0
mode: video-edit
category: cinematic
tags:
- video-edit
- object-removal
- inpainting
source:
  name: Kling 4.0 user guide
  url: https://kling.ai/quickstart/kling-4-model-user-guide
  credit: Kling AI
video: https://static-60.klingai-cdn-aws.com/kling-blog/presigned_url/13c66fc3-b663-4e6e-b50c-208bbd080a5c_1-4.mp4
