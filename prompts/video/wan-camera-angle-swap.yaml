id: wan-camera-angle-swap
title:
  en: Re-shoot your clip from new camera angles, same action
  zh: 动作不变，换机位重拍你的视频
model: Wan 3.0
mode: video-edit
tags:
- camera-angle
- video-reference
- workflow
source:
  name: '@Framer_X on X'
  url: https://x.com/Framer_X/status/2101324357108658433
  credit: Framer 🇱🇹
  likes: 1170
  captured: '2026-10-27'
  posted: '2026-09-19'
