notes:
  en: Pairing one saturated colour with a desaturated crowd gives the frame an immediate focal point. The prompt sets a clear spatial arc by moving the camera back until the figure becomes a small red shape in a concrete space.
  zh: 用一个饱和色与灰度人群形成对比，让画面有即时的焦点。提示词让镜头逐渐拉远，直到人物缩小为混凝土空间中的一抹红色，为整段视频定下清晰的空间走向。
prompt: |
  One of a thousand, and the only one in colour. A single crimson coat walks the stairs while a sea of grey hoods holds its breath, then the umbrellas open in a wave. The camera keeps pulling back until she’s just a red thread in a concrete cathedral.
