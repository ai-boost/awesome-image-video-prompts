  en: A locked character block and a fixed courtyard location keep the look consistent, while early 2000s DV camcorder cues such as handheld shake, autofocus hunting and exposure pumping sell the candid feel. A clear beat sequence, from the gust to the chase to a second item blowing away, gives the comedy a readable arc, and the glance to camera lands the punchline.
