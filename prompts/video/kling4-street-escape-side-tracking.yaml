id: kling4-street-escape-side-tracking
title:
  en: Twenty-second side-tracking escape down a busy street
  zh: 二十秒横向跟拍，女人拖着大包在街上逃
model: Kling 4.0
mode: keyframes-to-video
tags:
- long-take
- tracking-shot
- chase
- keyframes
- film-look
source:
  name: Kling 4.0 user guide
  url: https://kling.ai/quickstart/kling-4-model-user-guide
