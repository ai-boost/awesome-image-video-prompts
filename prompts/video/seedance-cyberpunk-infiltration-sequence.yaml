  en: The 28 second sequence is split into timecoded beats, each with one clear action and one camera move, so the model gets a shot list instead of a vague scene. A continuity line plus separate STYLE, CAMERA and QUALITY blocks repeat the look and the no subtitles or watermark rule across every segment.
