notes:
  en: A one line scene setup (year, city, place, action) is followed by a shot by shot script. Each line is labeled close-up or tight close-up and carries its spoken dialogue, so the model cuts between speakers on every line. The closing instruction to add no subtitles keeps the native speech clean.
  zh: 开头一句交代年份、城市、地点和动作，随后按镜头逐行写脚本。每行标注近景或特写并附带台词，模型会随每句话在两人之间切镜。结尾的不要加字幕指令让原生语音画面保持干净。
prompt: |
  2026年，上海。一个男人与一个女人在咖啡馆，喝咖啡，聊天。

  近景，女人问: "有房吗？"
  近景，男人说：”有“
  近景，女人问: "有车吗？"
  近景，男人说：”有"
  特写，女人说: "基础条件可以，但我还有几个条件。"
  特写，女人继续说: "婚后我们单住，你的父母不能过来住，你的工资全部上交，家务你全包"
  特写，男人说：”那你呢？"
  特写，女人问: "我只负责享受。"
  特写，男人说：”那我还不如养条狗，要你干嘛？"

  注意，不要加字幕。
