notes:
  en: A structured prompt written as labeled sections (format, header, panel layout, photography style, footer) makes GPT Image 2 produce an eight frame storyboard board. That board then serves as the visual reference that Gemini Omni Flash animates into a product shot.
  zh: 提示词按版式、页眉、分镜布局、摄影风格、页脚分段列出，让 GPT Image 2 先生成八格分镜板。再把分镜板作为视觉参考交给 Gemini Omni Flash，生成产品镜头。
