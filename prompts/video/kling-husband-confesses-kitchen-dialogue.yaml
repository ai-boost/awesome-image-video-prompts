notes:
  en: The prompt lists each shot with its lens and framing, sets a separate emotional arc for each character, and fixes lighting and the number of dialogue turns, so the scene holds together across cuts. A detailed audio spec covering lip sync, pauses and room tone supports the dialogue delivery.
