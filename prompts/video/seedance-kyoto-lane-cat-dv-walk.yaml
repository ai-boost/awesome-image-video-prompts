  en: The camera spec is spelled out in full (handheld shake, autofocus hunting, exposure shifts, no stabilization) so the footage reads as a friend's DV recording. Timed beats with a fixed location and outfit, plus location only audio and two spoken lines, keep the 30 second clip coherent.
