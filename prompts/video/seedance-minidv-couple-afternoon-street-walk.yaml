notes:
  en: A reference image locks identity, hairstyle and outfit, then a style line (early 2000s MiniDV, shaky handheld, autofocus hunting) sets the look. The story runs as a loose chain of beats from street food to sunset kiss, and the audio line asks for ambience and no music.
