  en: Written as an ordered shot list, each shot naming a camera distance and one physical action such as a chopstick lift, a tear or a spatula flip, which gives the model a clear sequence to follow. Texture cues like steam, drips and crust are stated as visible events rather than adjectives, which keeps the look consistent across cuts.
