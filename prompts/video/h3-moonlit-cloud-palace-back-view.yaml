notes:
  en: The subject is fixed as a still back view, and the negative prompt bans turning and walking so the motion goes to the environment. The slow push-in with the original composition held stable, plus drifting clouds, swaying pine and lantern light, gives the scene its movement.
  zh: 人物固定为静止的背影，负面提示同时禁止转身和行走，让动态集中在环境上。镜头缓慢推进并保持原画构图稳定，配合流动的云海、摇曳的松枝和灯笼光，形成画面动感。
