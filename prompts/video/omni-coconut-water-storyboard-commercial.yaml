  • Information cards:
    - Duration: 20 Seconds
    - Style: Fresh Natural Beverage Commercial
    - Product: Coconut Water
    - Audio: Tropical Water + Refreshing ASMR
  • Why This Style Works section
  • White, coconut green and natural beige aesthetic
