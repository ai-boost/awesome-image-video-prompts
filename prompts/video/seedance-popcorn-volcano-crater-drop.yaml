notes:
  en: The prompt gives a timed shot list from 0:00 to 0:17 and keeps the identity reference separate from the storyboard, so the face stays fixed while the action follows the timing. It also states physics rules and a full audio mix with no dialogue or text overlays, which keeps the eruption and popcorn spill readable.
