notes:
  en: Stacking the performance as timed beats (lean in and laugh, sing with crinkled eyes, glance away and back, sway to the rhythm) keeps the expression changing across the clip instead of a static lip sync. Reference-to-video anchors her look while the prompt carries the acting.
  zh: 把表演拆成按时间顺序的动作节拍（凑近镜头大笑、眯眼唱歌、移开视线再回看、随节奏摇头），让表情在整段里持续变化，而不是只对口型。参考图到视频锁定人物形象，提示词负责表演。
prompt: |
  She jokingly brings her face close to the camera and laughs.
  She sings cheerfully, full of excitement. She laughs with her eyes crinkled, smiles with the corners of her mouth turned up, and looks away briefly before looking back at the camera and laughing again. She sways her head to the rhythm, and her hair bounces up and down.
