notes:
  en: Pins the outfit, hair and wrist guards in concrete detail so the character stays consistent across cuts, then lists a run of camera setups (follow shot, low tracking, wide aerial, side close-up) so the clip reads as one edited chase. Stating vertical 9:16 up front sets the framing for the whole shot list.
