notes:
  en: One continuous handheld POV long take scripts every line, pause and micro-expression, so the comedy comes from timing rather than cuts. It fixes the hand's entry, contact and exit path, and keeps the angled mirror from reflecting the camera side.
  zh: 整段用一个连续手持第一人称长镜头，逐句写明台词、停顿和微表情，笑点靠节奏而不是切镜。同时写死手的进入、接触、撤回路径，并要求侧放的镜子不能映出拍摄一侧。
prompt: |
