  en: The prompt is written as a timed sequence of beats, from the low angle opening shot and white flash through the wireframe cage, body, tail fan and head reveal to the final hero shot, so the model gets a clear order of events. It closes with a lighting and finish tag list (volumetric god rays, iridescent feathers, 8K) that locks the look.
