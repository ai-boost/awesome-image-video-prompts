  en: 'Each reference image gets one role: image 1 for the woman''s face, hair and outfit, image 2 for the adult dragon, image 3 for the baby dragon. The closing sentence ties the baby''s pearl-white and pink colouring, amber slit-pupil eyes and pink-tipped crest to the adult, so both dragons read as one creature at different sizes.'
