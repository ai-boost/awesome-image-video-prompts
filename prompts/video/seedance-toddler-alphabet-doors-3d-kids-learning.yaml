notes:
  en: 'A fixed character and room description up front keeps the toddler consistent, then each letter gets its own scene built on one repeated pattern: colored door, big letter, door opens, reveal, on screen label. Separate blocks for animation and camera pin down hand to handle contact and gentle push ins across the many cuts.'
