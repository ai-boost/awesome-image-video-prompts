notes:
  en: The prompt sets a fixed beat of one mushroom every one and a half seconds and pairs each beat with a pitch step and a single drop, so sound, action and detail share one count. A locked macro camera keeps all seven mushrooms in frame for the whole sequence.
  zh: 提示词设定了每秒半一朵的固定节拍，并把每一拍同时对应到一个音高台阶和一滴水，使声音、动作与细节共用同一套计数。锁定的微距镜头让七朵蘑菇在整个序列中始终留在画面内。
prompt: |
  one mushroom every one and a half seconds, each a slightly higher note, each shedding one drop
