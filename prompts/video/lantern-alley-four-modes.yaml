id: lantern-alley-four-modes
title:
  en: 'One scene, four modes: text, image, keyframes, reference'
  zh: 同一场景的四种生成方式：文字、首帧、首尾帧、参考图
model: MiniMax H3 (open weights, ComfyUI)
tags:
- cinematic
- rain
- city
- landscape
- mode-comparison
- keyframes
- reference-to-video
- image-to-video
notes:
  en: The same rainy alley made four ways. Text-to-video creates the scene; image-to-video continues from a frame; keyframes interpolate between a first and last frame; reference-to-video keeps the location and lighting of a reference image while generating new motion. Short one-line prompts are enough once an image carries the look.
  zh: 同一条雨巷用四种方式生成。文生视频从零造场景；图生视频从一帧接着动；首尾帧在两张图之间补间；参考图生视频保留参考图的场景和光线，再生成新的运动。有图定下画面以后，一句话的提示词就够了。
runs:
- mode: text-to-video
  settings:
    resolution: 864x480
    duration_s: 5.2
    steps: 20
    sampler: res_multistep
    weights: minimax_h3_fl2va_pruned_int8_convrot.safetensors
    audio: true
  sample: samples/lantern-alley-four-modes-text-to-video.mp4
  preview: previews/lantern-alley-four-modes-text-to-video.gif
  prompt: |
    Realistic cinematic look: a lone red paper lantern drifting over a rain-slick Chongqing alley at dusk, neon reflections rippling in puddles, slow dolly-in, shallow depth of field, gentle ambient rain and distant traffic.
- mode: image-to-video
  inputs:
  - inputs/lantern-frame-a.png
  settings:
    resolution: 864x480
    duration_s: 5.2
    steps: 20
    sampler: res_multistep
    weights: minimax_h3_fl2va_pruned_int8_convrot.safetensors
    audio: true
  sample: samples/lantern-alley-four-modes-image-to-video.mp4
  preview: previews/lantern-alley-four-modes-image-to-video.gif
  prompt: |
    Continue the scene naturally from the opening frame: the red paper lantern drifts further down the rain-slick alley, camera pushes slowly forward, neon reflections sliding across the puddles, steady ambient rain.
- mode: keyframes-to-video
  inputs:
  - inputs/lantern-frame-a.png
  - inputs/lantern-frame-b.png
  settings:
    resolution: 864x480
    duration_s: 5.2
    steps: 20
    sampler: res_multistep
    weights: minimax_h3_fl2va_pruned_int8_convrot.safetensors
    audio: true
  sample: samples/lantern-alley-four-modes-keyframes-to-video.mp4
  preview: previews/lantern-alley-four-modes-keyframes-to-video.gif
  prompt: |
    Slow continuous dolly down the rain-slick neon alley, rain falling steadily.
- mode: reference-to-video
  inputs:
  - inputs/lantern-frame-a.png
  settings:
    resolution: 864x480
    duration_s: 5.2
    steps: 20
    sampler: res_multistep
    weights: minimax_h3_ref2va_pruned_int8_convrot.safetensors
    audio: true
  sample: samples/lantern-alley-four-modes-reference-to-video.mp4
  preview: previews/lantern-alley-four-modes-reference-to-video.gif
  prompt: |
    Use <Picture 1> as the location and lighting reference. Keep the same rain-slick alley, the same neon palette and the same wet-asphalt reflections. A slow steady dolly moves down the alley while rain keeps falling; ambient rain and distant traffic.
