notes:
  en: The prompt locks the reference image's face, wardrobe, framing and light at top priority, then breaks the 5 seconds into timed beats so the smile builds from eyes to mouth. A fixed camera with only breathing motion and a restrained environment keeps the clip from drifting.
  zh: 提示词以最高优先级锁定参考图的人脸、服装、构图和光线，再把5秒拆成分段时间轴，让笑容从眼神到嘴角逐步浮现。镜头固定、只允许轻微呼吸感，环境动态克制，画面不易漂移。
prompt: |
  @图片1

  生成一段5秒真人写实短视频，适用于 Minimax H3 全能模式。

  【最高优先级】
  严格保持@图片1中女生的人脸、五官、发型、妆容、肤色、服装、身材、靠树姿势、青枣、竹篮、江南水乡背景、夕阳光线、构图、焦段、景深和整体画面质感不变。

  不要重新设计人物，不要换脸，不要改变服装，不要改变场景。
  整个视频必须像真实摄影机随手捕捉到的一段生活瞬间：
  自然、松弛、清甜、灵动、毫无表演痕迹，绝对不要AI味。

  【人物状态】
  女生慵懒自然地斜靠在树干旁，身体保持放松。
  右手轻轻拿着一颗绿色青枣靠近嘴边。

  她不是刻意面对镜头表演，而是在吃青枣时自然注意到镜头。
  神态轻松，眼睛清澈明亮、有神、有真实焦点。
  嘴角原本只有很轻的笑意，随后因为吃到青枣而自然地笑开。

  重点：
  笑容一定是“慢慢浮现”，不能突然切换。
  眼睛先有笑意，嘴角随后跟着上扬。

  【5秒动作时间轴】

  0.00—0.70秒
  保持@图片1原始姿态。
  女生拿着青枣停在唇边，目光自然落在镜头附近。

  她的表情非常放松，
  嘴角只有一点轻轻的浅笑，
  眼神明亮、柔和、有神。

  身体几乎不动，
  只有非常轻微的自然呼吸，
  几缕头发被风轻轻吹动。

  0.70—1.60秒
  她自然地把青枣送到嘴边，
  轻轻张嘴，小口咬下一点。

  嘴唇先自然贴住青枣，
  牙齿轻轻咬合，
  随后手腕非常自然地把青枣稍微拿开一点。

  动作不要快，
  不要大口咬，
  不要夸张张嘴，
  不要故意做“吃东西”的表演动作。

  1.60—2.50秒
  她很轻地咀嚼一两下。

  咀嚼幅度极小，
  只是下颌和脸颊产生细微真实变化。

  不要鼓腮，
  不要左右嚼，
  不要连续机械咀嚼，
  不要像嚼口香糖。

  这一过程中，
  她的眼神开始出现更加明显的笑意，
  像觉得青枣很清甜，心情一下变得很好。

  2.50—3.70秒
  她忍不住自然地笑了起来。

  不是突然咧嘴大笑，
  而是：

  眼神先柔下来
  → 嘴角轻轻上扬
  → 苹果肌微微抬起
  → 眼睛自然弯起
  → 最后露出一点干净自然的牙齿。

  笑容甜美、清新、温柔，
  带一点点被镜头捕捉到之后的害羞感。

  她可以非常轻微地低一下眼，
  随后再抬眼看向镜头。

  动作幅度必须非常小，
  像真实女孩下意识的反应，
  不要做成刻意撒娇或摆拍。

  3.70—5.00秒
  她保持轻松甜美的笑容。

  手里仍然自然拿着那颗被咬过的青枣，
  停在嘴边附近。

  她看着镜头，
  眼睛清澈、明亮、灵动，
  笑意同时存在于眼睛和嘴角。

  最后约0.5秒保持一个最自然、最好看的浅笑状态结束。

  【表情重点】
  整段视频重点放在“眼神 + 微笑”的细微变化。

  眼睛必须：
  有真实焦点
  清澈明亮
  自然灵动
  带笑意
  不能瞪眼
  不能眼球乱转
  不能空洞无神

  笑容必须：
  先浅后深
  自然渐变
  眼睛和嘴角同步
  苹果肌轻微抬起
  不要突然露出整排牙齿
  不要大笑
  不要夸张卖萌

  允许一次非常自然的轻眨眼，
  不要频繁眨眼。

  【吃青枣真实感】
  必须表现真实连续动作：

  青枣靠近嘴唇
  → 嘴唇接触青枣
  → 小口咬下
  → 青枣离开嘴边
  → 轻微咀嚼
  → 自然笑起来。

  嘴唇、牙齿、手指、青枣之间必须保持正确遮挡关系。

  青枣始终保持真实圆润形态，
  咬过之后只出现一个自然的小缺口。

  禁止：
  青枣突然消失
  青枣变形
  青枣穿过嘴唇
  手指插进青枣
  牙齿异常
  嘴型抽动
  下巴变形
  机械咀嚼。

  【镜头】
  镜头基本固定。

  严格保持@图片1原始构图和摄影距离。

  不要推镜
  不要拉镜
  不要摇镜
  不要环绕
  不要突然变焦
  不要AI自动追脸。

  只允许极其轻微的真实摄影机呼吸感。

  焦点始终稳定在女生眼睛和面部，
  背景保持柔和自然虚化。

  【环境】
  环境动态非常克制。

  树叶和柳枝只被微风轻轻带动，
  远处河面有细小自然波光，
  乌篷船、小桥、建筑保持稳定。

  阳光保持@图片1原有的温暖金色夕阳逆光，
  发丝边缘有柔和金色轮廓光，
  脸部曝光稳定自然。

  皮肤保持真实细腻：
  有轻微毛孔和自然肤质，
  白皙通透但不过度磨皮，
  不要蜡像皮肤，
  不要塑料质感。

  【严格去AI味】
  这是一个真实女孩真实吃青枣时被摄影机偶然拍到的瞬间。

  所有动作都必须存在：
  轻微惯性
  自然停顿
  细小呼吸
  真实肌肉变化
  自然重力感。

  不要每个动作都正好卡在时间节点上，
  动作之间必须有自然连续的过渡。

  严格避免：
  AI假笑
  僵硬微笑
  突然表情变化
  机械眨眼
  机械咀嚼
  夸张嘴型
  嘴唇乱动
  眼神发空
  瞪眼
  频繁眨眼
  摇头晃脑
  过度撒娇
  刻意卖萌
  夸张害羞
  身体乱动
  五官漂移
  脸型变化
  牙齿变形
  手指变形
  皮肤塑料感
  背景闪烁
  光线跳变
  任何明显AI生成痕迹。

  【最终效果】
  夕阳下的江南水乡，
  女生安静地靠在树边，
  轻轻咬了一口手里的青枣。

  她一边轻轻吃着，
  眼睛里的笑意慢慢浮现，
  随后非常自然地甜甜笑了起来。

  笑容清甜、柔和、真实，
  眼睛清澈有神，
  没有刻意表演，
  像摄影师偶然捕捉到的一段极其自然、漂亮、舒服的5秒生活镜头。
