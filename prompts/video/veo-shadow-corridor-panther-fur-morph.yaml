notes:
  en: A structured JSON prompt with separate look, camera and continuity fields keeps the morph inside one unbroken take. Each lens change is tied to a stage of the transformation, so the model knows when the framing should widen.
  zh: 结构化 JSON 把外观、镜头和连续性拆成独立字段，让整段变形保持在一个连续镜头内。每次换镜头都绑定到变形的某个阶段，模型便知道何时该拉宽画面。
prompt: |
  Been testing json-format prompts for e-commerce product ads in Veo 3.1. Incredible results so far!

  Average generation time: 1 min to 3 mins

  Here are the prompts, give them a try and share your thoughts on Veo 3.1!

