notes:
  en: The prompt is written as an ordered sequence of story beats with a fixed character description, which keeps the same woman consistent from shot to shot. Concrete lighting and atmosphere terms such as volumetric fog and dramatic orange lighting set the mood, and the explicit ban on cartoon or anime styling keeps the output in live-action realism.
