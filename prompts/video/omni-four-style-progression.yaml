id: omni-four-style-progression
title:
  en: One clip through crayon, pencil, glass and risograph
  zh: 同一段视频依次变成蜡笔、铅笔、玻璃、孔版
model: Gemini Omni Flash
mode: video-edit
category: vfx
tags:
- style-transfer
- animation
source:
  name: Gemini Omni prompt guide
  url: https://deepmind.google/models/gemini-omni/prompt-guide/
  credit: Google DeepMind
video: https://storage.googleapis.com/gdm-deepmind-com-prod-public/media/FfbFqJ8qhY_ZWZyz/gemini_omni__prompt-guide__astro-sketch-valley.webm
inputs:
