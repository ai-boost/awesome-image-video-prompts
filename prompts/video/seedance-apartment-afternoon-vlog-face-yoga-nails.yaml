notes:
  en: A reference image locks identity and outfit, then five timed beats of about seven seconds each chain small domestic actions into one 30 second take. Handheld realism cues (camera shake, imperfect framing, autofocus) and a closed list of ambient sounds with no music keep it feeling like real footage.
