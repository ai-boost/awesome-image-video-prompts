notes:
  en: The prompt gives the scene a clear story contrast (the handmade mug at the back versus the porcelain cups used every day) and a tone cue (warm, funny, quietly moving), so the model has an emotional arc to animate without dialogue. The explicit 2.35:1 ratio and 30-second length fix the framing and pacing for one continuous shot.
