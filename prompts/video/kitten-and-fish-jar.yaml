id: kitten-and-fish-jar
title:
  en: Kitten knocks over the fish jar (15 s vertical)
  zh: 小猫打翻鱼干罐（15 秒竖屏）
model: MiniMax H3 (open weights, ComfyUI)
tags:
- cinematic
- vertical
- animals
