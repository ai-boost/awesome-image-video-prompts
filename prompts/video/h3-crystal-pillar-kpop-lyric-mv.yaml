  \ inside endless chrome mirror corridor, pink hair tips flying, reflections. Semi-transparent or wall typography readable exactly: Running through the space. Kinetic K-pop MV still, photoreal 16:9. Avoid different face, older look, explicit vulgar, extra fingers, gibberish unreadable letters, wrong lyrics, DONT BLINK, MIDNIGHT RUN, MAKE IT LOUD, ONE MORE TIME text, watermark, low-res, corporate black suit, childish loli\n\n5 · I'm feeling so gold  \nKeep the SAME Korean woman about 22 as the reference image: same facial identity, same eyes nose lips. Honey-ash brown soft waves, middle part. Cream champagne satin crop bustier fully covered stylish, ice-blue sparkle mini skirt, crystal jewelry, nude heels. Fashion-sexy premium K-pop, dewy K-beauty. Power medium pose, warm golden gel lighting shift, gold glitter dust in air, gold-chrome corridor or gold-lit stage (not cold cyan only). Large bold typography readable exactly: I'm feeling so gold. Photoreal cinematic 16:9. Avoid different face,\
