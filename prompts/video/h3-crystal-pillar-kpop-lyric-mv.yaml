notes:
  en: The prompt is a numbered shot list with one lyric per cut, and each shot repeats the same identity block plus a reference image as the facial anchor, which keeps the face consistent across cuts. Each lyric gets its own type motion such as sparkle reveal, punch scale or motion blur, so the typography drives the MV rhythm.
