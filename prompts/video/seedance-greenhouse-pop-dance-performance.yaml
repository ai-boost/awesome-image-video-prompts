notes:
  en: Separate character, outfit and background locks tied to two reference images keep identity and location stable across thirty seconds, and a negative prompt repeats those locks. Five timed scenes each name the choreography and a camera move, and the audio line specifies tempo, instruments and a bass drop on the final pose.
