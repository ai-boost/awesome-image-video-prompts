notes:
  en: The prompt sets the genre reference first, then builds the set from specific debris and golden light shafts through dust. It lists the choreography beats and camera moves in order and ends on one clear final action, a spinning kick through an altar. Film grain, a colour grade and a sound line with no dialogue cover look and audio.
