notes:
  en: The 15 second clip is split into five timed beats that alternate high aerial, low deck level and distant mountain shots, so the dragon's approach builds to a fireball hit on the lead ship. A closing style line of exclusions keeps faces out of close-ups and avoids celebrity likenesses.
