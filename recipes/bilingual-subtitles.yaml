id: bilingual-subtitles
title: {en: "Transcribe dialogue and burn in Chinese and English subtitles", zh: "听写台词，烧录中英双语字幕"}
tags: [agent-editing, ffmpeg, whisper, subtitles, bilingual, chinese-dialogue]
agent: Claude Opus 5.5 in Claude Code
tools: [ffmpeg 9 with libass, openai-whisper medium]
ask:
  en: "Transcribe the Chinese dialogue in samples/night-train-ticket.mp4, check it against the script in prompts/video/night-train-ticket.yaml, add an English line under each Chinese line, and burn the subtitles in."
  zh: "听写 samples/night-train-ticket.mp4 里的中文台词，对照 prompts/video/night-train-ticket.yaml 里的剧本校对，每句中文下面加一行英文，把字幕烧进画面。"
inputs: [samples/night-train-ticket.mp4]
commands: |
  whisper samples/night-train-ticket.mp4 --model medium --language zh --output_format srt
  # whisper heard 我等了他八年 / 就等着一趟车; the script says 我等了她八年 / 就等这一趟车.
  # The agent kept whisper's timing, took the wording from the script, and added English lines:
  #   1  00:00:00,000 --> 00:00:02,100  我等了她八年， / I waited eight years for her,
  #   2  00:00:02,200 --> 00:00:04,200  就等这一趟车。 / all for this one train.
  ffmpeg -i samples/night-train-ticket.mp4 \
    -vf "subtitles=subs.srt:force_style='FontName=PingFang SC,FontSize=15,Outline=1,Shadow=0,MarginV=22'" \
    -c:v libx264 -crf 20 -c:a copy subtitled.mp4
notes:
  en: "Whisper gets homophones wrong in Chinese (他 and 她 sound identical). When a script exists, tell the agent to use it for wording and whisper only for timing."
  zh: "Whisper 会听错中文同音字（他和她读音相同）。有剧本时，让 Agent 用剧本定文字，只用 Whisper 定时间。"
