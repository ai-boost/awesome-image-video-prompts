# Weekly X refresh: one search per line, run in order by scripts/x_collect.py --config.
# Keep the total small; the searches run on a real signed-in account.
- {model: Seedance 2.5, kind: video, max: 8, query: '"Seedance 2.5" prompt min_faves:400 filter:videos'}
- {model: Wan 3.0, kind: video, max: 8, query: '("Wan 3.0" OR wan3.0) prompt min_faves:150 filter:videos'}
- {model: Kling 4.0, kind: video, max: 8, query: '"Kling 4.0" prompt min_faves:150 filter:videos'}
- {model: Kling 3.0, kind: video, max: 6, query: '"Kling 3.0" prompt min_faves:200 filter:videos'}
- {model: Veo 3.1, kind: video, max: 5, query: '"Veo 3.1" prompt min_faves:300 filter:videos'}
- {model: MiniMax H3, kind: video, max: 5, query: '("MiniMax H3" OR "Hailuo H3") prompt min_faves:150 filter:videos'}
- {model: Gemini Omni Flash, kind: video, max: 5, query: '"Gemini Omni" prompt min_faves:150 filter:videos'}
- {model: GPT Image 2.6, kind: image, max: 10, query: '("Images 2.6" OR "GPT Image 2.6") prompt min_faves:60 filter:images'}
# GIF posts: a GIF prompt is often one short line and its post gets few likes, so search Latest with a low bar and let the review judge.
- {model: GPT Image 2.6, kind: image, max: 20, tab: live, min_likes: 3, model_re: 'images?[\s_-]*2\.6|gpt-image-2\.6|sunburst|\bflare\b', query: '("Images 2.6" OR "GPT Image 2.6") (gif OR prompt OR プロンプト OR 提示词) filter:media'}
- {model: GPT Image 2.5, kind: image, max: 10, query: '"GPT Image 2.5" prompt min_faves:250 filter:images'}
- {model: Nano Banana 2.1, kind: image, max: 8, query: '"Nano Banana 2.1" prompt min_faves:120 filter:images'}
# Seedream 5.5 (ByteDance, out 2026-11-09): new entries go straight onto its agentcraft model page (startup gap §97). New, so likes are still low.
- {model: Seedream 5.5, kind: image, max: 12, model_re: 'seedream[\s_-]*5\.5', query: '("Seedream 5.5" OR seedream5.5 OR 即梦5.5) prompt min_faves:30 filter:images'}
# Seasonal: Christmas photo prompts for agentcraft.dev/prompts/image/christmas/, searched only in these months.
- {model: GPT Image 2.5, kind: image, max: 10, months: [11, 12, 1], query: '(christmas OR xmas OR santa) prompt "gpt image 2.5" filter:images min_faves:60'}
- {model: Nano Banana 2.1, kind: image, max: 10, months: [11, 12, 1], model_re: 'banana 2\.1|nb ?2\.1', query: '(christmas OR xmas OR santa) prompt "nano banana 2.1" filter:images min_faves:20'}
- {model: GPT Image 2.6, kind: image, max: 10, months: [11, 12, 1], model_re: 'images?[\s_-]*2\.6|gpt-image-2\.6|sunburst|\bflare\b', query: '(christmas OR xmas OR santa) ("Images 2.6" OR "GPT Image 2.6") prompt filter:images min_faves:20'}
# Family and baby Christmas photos: the fastest-rising Christmas searches last season, and the thinnest part of the page.
- {model: GPT Image 2.6, kind: image, max: 10, months: [11, 12, 1], tab: live, min_likes: 5, model_re: 'images?[\s_-]*2\.6|gpt-image-2\.6|sunburst|\bflare\b', query: '(christmas OR xmas OR santa) (family OR baby OR toddler OR newborn OR kids OR 家族 OR 赤ちゃん OR 全家福 OR 宝宝) ("Images 2.6" OR "GPT Image 2.6") filter:images'}
- {model: Nano Banana 2.1, kind: image, max: 10, months: [11, 12, 1], tab: live, min_likes: 5, model_re: 'banana 2\.1|nb ?2\.1', query: '(christmas OR xmas OR santa) (family OR baby OR toddler OR newborn OR kids OR 家族 OR 赤ちゃん OR 全家福 OR 宝宝) "nano banana 2.1" filter:images'}
# Lunar New Year (2027-02-06) for agentcraft.dev/prompts/image/lunar-new-year/: last season's Nano Banana Pro posts now, the new models as they appear.
- {model: Nano Banana Pro, kind: image, max: 10, months: [11, 12, 1, 2], model_re: 'banana pro|nano banana', query: '("chinese new year" OR "lunar new year" OR 春节 OR 新年 OR 过年 OR 红包) prompt ("nano banana pro" OR "nano banana") filter:images min_faves:30'}
- {model: GPT Image 2.6, kind: image, max: 10, months: [12, 1, 2], tab: live, min_likes: 5, model_re: 'images?[\s_-]*2\.6|gpt-image-2\.6|sunburst|\bflare\b', query: '("chinese new year" OR "lunar new year" OR 春节 OR 新年 OR 过年 OR 红包) ("Images 2.6" OR "GPT Image 2.6") filter:images'}
- {model: Nano Banana 2.1, kind: image, max: 10, months: [12, 1, 2], tab: live, min_likes: 5, model_re: 'banana 2\.1|nb ?2\.1', query: '("chinese new year" OR "lunar new year" OR 春节 OR 新年 OR 过年 OR 红包) "nano banana 2.1" filter:images'}
# Valentine's Day (2027-02-14) for agentcraft.dev/prompts/image/valentines-day/: last season's Nano Banana Pro posts now, the new models as they appear.
- {model: Nano Banana Pro, kind: image, max: 10, months: [11, 12, 1, 2], model_re: 'banana pro|nano banana', query: '(valentine OR valentines OR バレンタイン OR 情人节) prompt ("nano banana pro" OR "nano banana") filter:images min_faves:30'}
- {model: GPT Image 2.6, kind: image, max: 10, months: [12, 1, 2], tab: live, min_likes: 5, model_re: 'images?[\s_-]*2\.6|gpt-image-2\.6|sunburst|\bflare\b', query: '(valentine OR valentines OR バレンタイン OR 情人节) ("Images 2.6" OR "GPT Image 2.6") filter:images'}
- {model: Nano Banana 2.1, kind: image, max: 10, months: [12, 1, 2], tab: live, min_likes: 5, model_re: 'banana 2\.1|nb ?2\.1', query: '(valentine OR valentines OR バレンタイン OR 情人节) "nano banana 2.1" filter:images'}
# Style and use-case prompts with rising searches but fewer than 8 entries (Trends 2026-11-07): caricature, tattoo,
# photo restoration, polaroid, action figure, headshot, ID photo and coloring page. Pages open once a style has 8.
- {model: GPT Image 2.6, kind: image, max: 10, tab: live, min_likes: 10, model_re: 'images?[\s_-]*2\.6|gpt-image-2\.6|sunburst|\bflare\b', query: '(caricature OR tattoo OR "photo restoration" OR "restore old photo" OR polaroid OR "action figure" OR figurine OR headshot OR "id photo" OR "passport photo" OR "coloring page") ("Images 2.6" OR "GPT Image 2.6") filter:images'}
- {model: Nano Banana 2.1, kind: image, max: 10, tab: live, min_likes: 10, model_re: 'banana 2\.1|nb ?2\.1', query: '(caricature OR tattoo OR "photo restoration" OR "restore old photo" OR polaroid OR "action figure" OR figurine OR headshot OR "id photo" OR "passport photo" OR "coloring page") "nano banana 2.1" filter:images'}
